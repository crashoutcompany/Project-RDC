name: Neon branches

on:
  pull_request:
    types: [opened, reopened]
  # Close runs on pull_request_target: GitHub skips pull_request workflows
  # (closed included) for PRs with merge conflicts, so those PRs kept their
  # Neon branch. The shared delete job only calls the Neon API.
  pull_request_target:
    types: [closed]
  # Safety net for missed events; see neon-sweep.yml in crashoutcompany/.github.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only list the branches that would be deleted.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  neon:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    uses: crashoutcompany/.github/.github/workflows/neon-branches.yml@4b12aa1219d314a94d0c3a69c4b30258a8aa3561 # v1.1.0
    secrets: inherit

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    uses: crashoutcompany/.github/.github/workflows/neon-sweep.yml@4b12aa1219d314a94d0c3a69c4b30258a8aa3561 # v1.1.0
    with:
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
