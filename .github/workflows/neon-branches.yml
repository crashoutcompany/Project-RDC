name: Neon branches

on:
  # synchronize reruns create on every push: a no-op for the Neon branch, but it
  # refreshes the Vercel preview env vars (and recreates an expired branch).
  pull_request:
    types: [opened, reopened, synchronize]
  # Close runs on pull_request_target: GitHub skips pull_request workflows
  # (closed included) for PRs with merge conflicts, so those PRs kept their
  # Neon branch. The shared delete job only calls the Neon API.
  pull_request_target:
    types: [closed]
  # Safety net for missed events; see neon-sweep.yml in crashoutcompany/.github.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only list the branches that would be deleted.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  neon:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
    uses: crashoutcompany/.github/.github/workflows/neon-branches.yml@5d2d4262884eeddf65a9b5ea29d62327a1698c5d # v1.3.0
    with:
      vercel-preview-env: true
    secrets: inherit

  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
    uses: crashoutcompany/.github/.github/workflows/neon-sweep.yml@5d2d4262884eeddf65a9b5ea29d62327a1698c5d # v1.3.0
    with:
      dry-run: ${{ inputs.dry-run || false }}
      vercel-preview-env: true
    secrets: inherit
