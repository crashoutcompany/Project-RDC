name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: crashoutcompany/.github/.github/workflows/ci.yml@v1
    with:
      install-flags: --ignore-scripts
      needs-prisma: true
      has-e2e: true
      use-prisma-neon: true
      sync-prisma-neon: true
      e2e-better-auth-url: http://127.0.0.1:3000
      e2e-secrets: NEXT_PUBLIC_POSTHOG_HOST NEXT_PUBLIC_POSTHOG_KEY RESEND_API_KEY
    secrets: inherit
