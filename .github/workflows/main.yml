# shared:ci-main v2
# Skeleton aligned with View/Z/blue ci-main. RDC intentional knobs:
#   NEEDS_PRISMA=true          — lint/test apply schema to local Postgres
#   INSTALL_FLAGS=--ignore-scripts — skip postinstall (prisma generate runs explicitly)
#   USE_PRISMA_NEON=true       — Neon create-branch-action prisma URL shaping
# Optional e2e knobs (set in the e2e job, not unmarked forks):
#   SYNC_PRISMA_NEON=true      — prisma db push + generate on Neon branch before e2e
#   BETTER_AUTH_URL            — loopback URL for authenticated Playwright
name: Actions CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAS_TYPECHECK: "false"
  HAS_E2E: "true"
  NEEDS_PRISMA: "true"
  TEST_SCRIPT: test
  INSTALL_FLAGS: --ignore-scripts
  USE_PRISMA_NEON: "true"
  # Optional: sync Prisma schema onto Neon e2e branches (Better Auth tables, etc.)
  SYNC_PRISMA_NEON: "true"
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
  DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/ci?schema=public
  BETTER_AUTH_SECRET: test-better-auth-secret-at-least-32-characters
  TEST_AUTH_SECRET: test-auth-secret

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile ${{ env.INSTALL_FLAGS }}
      - name: Apply Prisma schema
        if: env.NEEDS_PRISMA == 'true'
        run: |
          pnpm exec prisma db push
          pnpm exec prisma generate --sql
      - run: pnpm lint
      - name: Typecheck
        if: env.HAS_TYPECHECK == 'true'
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile ${{ env.INSTALL_FLAGS }}
      - name: Apply Prisma schema
        if: env.NEEDS_PRISMA == 'true'
        run: |
          pnpm exec prisma db push
          pnpm exec prisma generate --sql
      - run: pnpm ${{ env.TEST_SCRIPT }}

  build:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-e2e-only-better-auth-secret-32chars' }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --global vercel@latest
      - name: Pull Vercel environment
        env:
          VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
      - name: Build with Vercel
        env:
          VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi

  e2e:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_AUTH_SECRET: ${{ secrets.TEST_AUTH_SECRET || 'test-auth-secret' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-e2e-only-better-auth-secret-32chars' }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_E2E == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_E2E == 'true'
        with:
          version: 10.1.0
      - uses: actions/setup-node@v4
        if: env.HAS_E2E == 'true'
        with:
          node-version: "24"
          cache: pnpm

      - name: Resolve Neon branch
        if: env.HAS_E2E == 'true'
        id: neon
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_REF: ${{ github.head_ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            safe_ref="${HEAD_REF//\//-}"
            printf 'name=preview/pr-%s-%s\n' "$PR_NUMBER" "$safe_ref" >> "$GITHUB_OUTPUT"
            printf 'ephemeral=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'name=ci/e2e-%s\n' "$GIT_SHA" >> "$GITHUB_OUTPUT"
            printf 'ephemeral=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reuse Neon branch
        if: env.HAS_E2E == 'true'
        id: database
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.neon.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: ${{ secrets.NEON_DATABASE }}
          role: ${{ secrets.NEON_ROLE }}
          prisma: ${{ env.USE_PRISMA_NEON == 'true' }}

      - name: Install dependencies
        if: env.HAS_E2E == 'true'
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.database.outputs.db_url }}
        run: pnpm install --frozen-lockfile

      # Optional knob: Neon preview branches can lag parent schema (Better Auth).
      - name: Sync Prisma schema to Neon branch
        if: env.HAS_E2E == 'true' && env.SYNC_PRISMA_NEON == 'true'
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.database.outputs.db_url }}
        run: |
          pnpm exec prisma db push
          pnpm exec prisma generate --sql

      - name: Install Playwright Chromium
        if: env.HAS_E2E == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated E2E
        if: env.HAS_E2E == 'true'
        env:
          DATABASE_URL: ${{ steps.database.outputs.db_url_pooled }}
          DIRECT_URL: ${{ steps.database.outputs.db_url }}
          EXPOSE_TESTING_API: "1"
          # Optional knob: force loopback Better Auth base URL for Playwright.
          BETTER_AUTH_URL: http://127.0.0.1:3000
        run: pnpm test:e2e

      - name: Delete ephemeral Neon branch
        if: always() && env.HAS_E2E == 'true' && steps.neon.outputs.ephemeral == 'true' && steps.database.outcome == 'success'
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.database.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
