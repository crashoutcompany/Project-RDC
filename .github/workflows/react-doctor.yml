name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    uses: crashoutcompany/.github/.github/workflows/react-doctor.yml@020f7e78cd5cd56b0d110210bd2ef1b715c75be3 # v1.4.0
