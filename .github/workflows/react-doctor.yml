name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    uses: crashoutcompany/.github/.github/workflows/react-doctor.yml@03bade3a0c168a59340fb8e338bf19b52c79f9bc # main 03bade3 (post-#16)
