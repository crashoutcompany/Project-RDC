name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    uses: crashoutcompany/.github/.github/workflows/react-doctor.yml@235f2a90b6c594065cdb96e656f2cd79a7e00476 # v1.5.0
